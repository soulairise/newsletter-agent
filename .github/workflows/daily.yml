name: 매일 아침 브리핑 발행

on:
  schedule:
    # cron 은 UTC 다. 한국 아침 7시 = 전날 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch:          # 깃허브 화면의 버튼으로 즉시 실행
    inputs:
      profile:
        description: "발행할 프로필"
        required: false
        default: "yoga"
        type: choice
        options: ["yoga", "economy", "ai"]
      dry_run:
        description: "1이면 보내지 않고 무엇을 보낼지만 확인"
        required: false
        default: "0"

concurrency:                  # 앞 실행이 안 끝났으면 겹쳐 돌리지 않는다
  group: daily-brief
  cancel-in-progress: false

permissions:
  contents: write             # docs/ 를 커밋해 되돌려 놓기 위해 필요

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # 매달리면 끊는다
    strategy:
      # 예약 실행은 두 프로필을 차례로 돌린다.
      # 수동 실행은 고른 프로필 하나만 돈다.
      max-parallel: 1         # docs 커밋이 겹치지 않도록 순차로
      matrix:
        profile: ${{ github.event_name == 'schedule' && fromJSON('["yoga","economy","ai"]')
                     || fromJSON(format('["{0}"]', github.event.inputs.profile || 'yoga')) }}
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync

      - name: 발행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          NEWSLETTER_PROFILE: ${{ matrix.profile }}
          TZ: Asia/Seoul
        run: uv run python run.py

      - name: 발행 페이지 커밋
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "docs 에 변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "newsletter-agent"
          git config user.email "noreply@github.com"
          git add docs
          git commit -m "브리핑 발행 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push

      - name: 실행 지표 보관
        if: always()          # 실패해도 남긴다
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.profile }}-${{ github.run_number }}
          path: store/metrics.jsonl
          if-no-files-found: ignore
          retention-days: 30
